<form hx-post="/reset-password" hx-swap="none">
	<input type="hidden" name="token" value="{{ token }}">

	<div class="input-group mt-4">
		<div class="input-group-text">
			<i class="bi bi-lock-fill"></i>
		</div>
		<input class="form-control bg-light" type="password" name="password" placeholder="Contraseña" />
	</div>
	<div class="input-group mt-1">
		<div class="input-group-text">
			<i class="bi bi-lock-fill"></i>
		</div>
		<input class="form-control bg-light" type="password" name="confirmPassword"
			placeholder="Repite tu contraseña" />
	</div>
	<div class="d-flex justify-content-around mt-1">
	</div>
	<input type="submit" class="btn text-white w-100 mt-4 fw-semibold shadow-sm" value="Actualizar contraseña"/>
</form>
