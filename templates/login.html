{% extends "layout.html" %} {% block container %}

<div class="d-flex justify-content-center align-items-center">
	<div class="borderTable p-5 rounded-5 text-secondary shadow" style="width: 25rem">
		<form action="/login" method="post">

			<div class="text-center fs-1 fw-bold">Login</div>
			<div class="input-group mt-4">
				<div class="input-group-text">
					<svg width="15px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
						<path
							d="M224 256c70.7 0 128-57.3 128-128S294.7 0 224 0S96 57.3 96 128s57.3 128 128 128zm-45.7 48C79.8 304 0 383.8 0 482.3C0 498.7 13.3 512 29.7 512H418.3c16.4 0 29.7-13.3 29.7-29.7C448 383.8 368.2 304 269.7 304H178.3z" />
					</svg>
				</div>
				<input class="form-control bg-light" type="text" name="user_id" placeholder="Usuario o email" />
			</div>
			<div class="input-group mt-1">
				<div class="input-group-text">
					<svg width="15px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
						<path
							d="M144 144v48H304V144c0-44.2-35.8-80-80-80s-80 35.8-80 80zM80 192V144C80 64.5 144.5 0 224 0s144 64.5 144 144v48h16c35.3 0 64 28.7 64 64V448c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V256c0-35.3 28.7-64 64-64H80z" />
					</svg>
				</div>
				<input class="form-control bg-light" type="password" name="password" placeholder="Contraseña" />
			</div>
			<div class="d-flex justify-content-around mt-1">
				<div class="pt-1">
					<a href="/forgot-password" class="text-decoration-none text-info fw-semibold fst-italic"
						style="font-size: 0.9rem">¿Has olvidado tu contraseña?</a>
				</div>
			</div>
			<input type="submit" class="btn text-white w-100 mt-4 fw-semibold shadow-sm" value="Iniciar sesión"></input>
		</form>
		<a type="button" class="btn text-white w-100 mt-4 fw-semibold shadow-sm" value="OIDC Login"
			href="/oidc/login">OIDC Login</a>
	</div>
</div>
{% endblock %}

{% block user_info %}
{% endblock %}
