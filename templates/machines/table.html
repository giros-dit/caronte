<table id="machines" class="table table-striped table-hover" style="width:100%">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Dirección MAC</th>
      <th>Dirección IP</th>
      <th>Puerto</th>
      <th class="text-center">Estado</th>
      <th class="text-center">Editar</th>
    </tr>
  </thead>
  <tbody id="table-contents">
    {% include "machines/table_contents.html" %}
  </tbody>
  <tfoot>
    <tr id="add">
      <td colspan="100%" class="text-center">
        <i class="bi bi-plus-circle-fill clickable-button" hx-get="/admin/machines/new" hx-target="#table-contents"
          hx-swap="beforeend"></i>
      </td>
    </tr>
  </tfoot>
</table>
