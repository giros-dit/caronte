<tr id="{{ machine['id'] }}">
    <td>
        <input class="form-control" name="name" class="name" type="text" value="{{ machine['name'] }}">
    </td>
    <td>
        <input class="form-control" name="mac" class="mac" type="text" value="{{ machine['mac'] }}">
    </td>
    <td>
        <input class="form-control" name="ip" class="ip" type="text" value="{{ machine['ip'] }}">
    </td>
    <td>
        <input class="form-control" name="port" class="port" type="number" length="5" value="{{ machine['port'] }}">
    </td>
    <td class="text-center">
        <div class="buttonCell">
            {% include 'buttons/wol.html' %}
            {% include 'buttons/ping.html' %}
        </div>
    </td>
    <td class="text-center">
        <div class="buttonCell">
            {% set subpath = 'machines' %}
            {% set element = 'máquina' %}
            {% set entity = machine %}
            {% include 'buttons/save.html' %}
            {% include 'buttons/cancel.html' %}
        </div>
    </td>
</tr>
