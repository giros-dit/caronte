<tr id="{{ machine['id'] }}">
    <td>
        <input class="form-control" name="name" class="name" type="text" value="{{ machine['name'] }}">
    </td>
    <td>
        <input class="form-control" name="mac" class="mac" type="text" value="{{ machine['mac'] }}">
    </td>
    <td>
        <input class="form-control" name="ip" class="ip" type="text" value="{{ machine['ip'] }}">
    </td>
    <td>
        <input class="form-control" name="port" class="port" type="number" length="5" value="{{ machine['port'] }}">
    </td>
    <td class="text-center">
        <div class="buttonCell">
            {% include 'wol_button.html' %}
            {% include 'ping_button.html' %}
        </div>
    </td>
    <td class="text-center">
        <div class="buttonCell">
            <i class="bi bi-floppy2 clickable-button" hx-put="/admin/machines/{{ machine['id'] }}"
                hx-include="closest tr" hx-target="closest tr" hx-swap="outerHTML"></i>
            <i class="bi bi-x-lg clickable-button" hx-delete="/admin/machines/{{ machine['id'] }}"
                hx-target="closest tr" hx-swap="delete"></i>
        </div>
    </td>
</tr>
