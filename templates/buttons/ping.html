<span id="ping-button-{{ machine.id}}" class="action-toggle">
    <span hx-get="/api/ping?id={{ machine.id }}" hx-indicator="#ping-indicator-{{ machine.id }}" hx-target="#ping-button-{{ machine.id }}"
        hx-swap="outerHTML" hx-on::before-request="this.closest('.action-toggle').classList.add('is-loading')" hx-on::after-request="this.closest('.action-toggle').classList.remove('is-loading')">

        {% if status %}
        <i class="bi bi-check-circle-fill clickable-button"></i>
        {% elif status == False %}
        <i class="bi bi-x-circle-fill clickable-button"></i>
        {% else %}
        <i class="bi bi-question-circle clickable-button">
        </i>
        {% endif %}
    </span>

    <i id="ping-indicator-{{ machine.id }}" class="bi bi-arrow-clockwise clickable-button spinning-indicator"></i>
</span>
