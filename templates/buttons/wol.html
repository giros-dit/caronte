<span id="wol-button-{{ machine.id }}" class="action-toggle">
    <span hx-get="/api/wol/{{ machine.id }}" hx-indicator="#wol-indicator-{{ machine.id }}" hx-target="#wol-button-{{ machine.id }}"
        hx-swap="outerHTML" hx-on::before-request="this.closest('.action-toggle').classList.add('is-loading')" hx-on::after-request="this.closest('.action-toggle').classList.remove('is-loading')">
        
        {% if status %}
        <i class="bi bi-check-circle-fill clickable-button"></i>
        {% else %}
        <i class="bi bi-power clickable-button">
        </i>
        {% endif %}
    </span>

    <i id="wol-indicator-{{ machine.id }}" class="bi bi-arrow-clockwise clickable-button spinning-indicator"></i>
</span>
