{% extends "layout.html" %}

{% block container %}
<h3>Usuarios</h2>
<div class="borderTable align-middle">
  <input type="text" id="search" name="search" class="form-control" placeholder="Buscar..."
         hx-get="/users/search" hx-swap="innerHTML" hx-target="#table-contents" 
         hx-trigger="keyup changed delay:500ms"
         hx-params="search">
  <br>
  {% include "users/table.html" %}
</div>
{% endblock %}

{% block user_info %}
  {{ super() }}
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script src="{{ url_for('static', filename='js/userFunctions.js')}}"></script>
{% endblock %}
