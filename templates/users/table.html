<table id="users" class="table table-striped table-hover" style="width:100%">
  <thead>
    <tr>
      <th>Usuario</th>
      <th>Email</th>
      <th>Admin</th>
      <th>Editar</th>
    </tr>
  </thead>
  <tbody id="table-contents">
    {% include "users/table_contents.html" %}
  </tbody>
  <tfoot>
    <tr id="add">
      <td colspan="100%" class="text-center">
        <span id="new-button" class="action-toggle">
          <span hx-get="/admin/users/new" hx-indicator="#new-indicator"
            hx-target="#table-contents" hx-swap="beforeend"
            hx-on::before-request="this.closest('.action-toggle').classList.add('is-loading')"
            hx-on::after-request="this.closest('.action-toggle').classList.remove('is-loading')">
            <i class="bi bi-plus-circle-fill clickable-button"></i>
          </span>

          <i id="new-indicator"
            class="bi bi-arrow-clockwise clickable-button spinning-indicator"></i>
        </span>
      </td>
    </tr>
  </tfoot>
</table>
