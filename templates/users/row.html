<tr id="{{ user['id'] }}">
    <td>
        <p class="username">{{ user['username'] }}</p>
    </td>
    <td>
        <p class="email">{{ user['email'] }}</p>
    </td>
    <td class="text-center">
        {% if user['admin'] %}<i class="bi bi-check-circle-fill"></i>{% else
        %}<i class="bi bi-x-circle-fill"></i>{%
        endif %}
    </td>
    <td class="text-center">
        <div class="buttonCell">
            <a href="/admin/ownership/{{ user['id'] }}/machines"><i
                    class="bi bi-pc-display clickable-button"></i></a>
            {% if not user['external'] %}
            <span class="action-toggle">
                <span
                    hx-patch="/admin/users/{{ user['id'] }}"
                    hx-indicator="#lock-indicator-{{ user['id'] }}"
                    hx-swap="none"
                    hx-on::before-request="this.closest('.action-toggle').classList.add('is-loading')"
                    hx-on::after-request="this.closest('.action-toggle').classList.remove('is-loading')">
                    <i class="bi bi-unlock2-fill clickable-button"></i>
                </span>

                <i id="lock-indicator-{{ user['id'] }}"
                    class="bi bi-arrow-clockwise clickable-button spinning-indicator"></i>
            </span>
            {% endif %}
            
            {% set subpath = 'users' %}
            {% set element = 'usuario' %}
            {% set entity = user %}
            {% include 'buttons/edit.html' %}

            {% include 'buttons/delete.html' %}
        </div>
    </td>
</tr>
