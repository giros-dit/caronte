<tr id="{{ user['id'] }}">
    <td>
        <p class="username">{{ user['username'] }}</p>
    </td>
    <td>
        <p class="email">{{ user['email'] }}</p>
    </td>
    <td class="text-center">
        {% if user['admin'] %}<i class="bi bi-check-circle-fill"></i>{% else %}<i class="bi bi-x-circle-fill"></i>{%
        endif %}
    </td>
    <td class="text-center">
        <div class="buttonCell">
            <a href="/admin/ownership/{{ user['id'] }}/machines"><i class="bi bi-pc-display clickable-button"></i></a>
            {% if not user['external'] %}
            <i class="bi bi-unlock2-fill clickable-button" hx-patch="/admin/users/{{ user['id'] }}" hx-swap="none"></i>
            {% endif %}
            <i class="bi bi-pencil-square clickable-button" hx-get="/admin/users/{{ user['id'] }}/edit"
                hx-trigger="edit" hx-target="closest tr" hx-swap="outerHTML" onClick="let editing = document.querySelector('.editing')
                         if(editing) {
                           Swal.fire({title: 'Already Editing',
                                      showCancelButton: true,
                                      confirmButtonText: 'Yep, Edit This Row!',
                                      text:'Hey!  You are already editing a row!  Do you want to cancel that edit and continue?'})
                           .then((result) => {
                                if(result.isConfirmed) {
                                   htmx.trigger(editing, 'cancel')
                                   htmx.trigger(this, 'edit')
                                }
                            })
                         } else {
                            htmx.trigger(this, 'edit')
                         }">
            </i>

            <i class="bi bi-trash-fill clickable-button" hx-delete="/admin/users/{{ user['id'] }}"
                hx-confirm="Are you sure you want to delete this user?" hx-target="closest tr"></i>
        </div>
    </td>
</tr>
