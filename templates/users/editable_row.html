<tr id="{{ user['id'] }}">
    <td>
        <input class="form-control" name="username" class="username" type="text" value="{{ user['username'] }}"
            {{'disabled' if user['external'] else '' }}>
    </td>
    <td>
        <input class="form-control" name="email" class="email" type="email" value="{{ user['email'] }}" {{'disabled' if
            user['external'] else '' }}>
    </td>
    <td class="text-center">
        <div class="form-check form-switch d-flex justify-content-center">
            <input name="admin" class="form-check-input isAdmin" type="checkbox" {{'checked' if user['admin'] else ''
                }}>
        </div>
    </td>
    <td class="text-center">
        <div class="buttonCell">
            {% set subpath = 'users' %}
            {% set element = 'usuario' %}
            {% set entity = user %}
            {% include 'buttons/save.html' %}
            {% include 'buttons/cancel.html' %}
        </div>
    </td>
</tr>
