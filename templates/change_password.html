{% extends "layout.html" %} {% block container %}

<div class="d-flex justify-content-center align-items-center">
	<form action="/reset-password" method="post">
		<div class="borderTable p-5 rounded-5 text-secondary shadow" style="width: 25rem">

			<div class="text-center fs-5 fw-bold">Antes de continuar, debes actualizar tu contraseña</div>
			<div class="input-group mt-4">
				<input type="hidden" name="token" value="{{ token }}">
				<div class="input-group-text">
					<i class="bi bi-unlock2-fill"></i>
				</div>
				<input
					class="form-control bg-light"
					type="password"
					name="password"
					placeholder="Contraseña"
				/>
			</div>
			<div class="input-group mt-1">
				<div class="input-group-text">
					<i class="bi bi-unlock2-fill"></i>
				</div>
				<input
					class="form-control bg-light"
					type="password"
					name="confirmPassword"
					placeholder="Repite tu contraseña"
				/>
			</div>
			<div class="d-flex justify-content-around mt-1">
			</div>
			<input type="submit" class="btn text-white w-100 mt-4 fw-semibold shadow-sm" value="Actualizar contraseña"></input>
		</div>
	</form>
</div>
{% endblock %}



{% block user_info %}
{% endblock %}
